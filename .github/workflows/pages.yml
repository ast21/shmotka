name: Showcase

# Builds the showcase (showcase/dist) and deploys it to Cloudflare Pages (project "shmotka")
# after every merge to main. Needs repository secrets CLOUDFLARE_API_TOKEN (Pages: Edit)
# and CLOUDFLARE_ACCOUNT_ID; without them the deploy step is skipped.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run showcase
      - name: Deploy to Cloudflare Pages
        if: env.HAS_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.156.0 pages deploy showcase/dist --project-name shmotka --branch main --commit-dirty=true
      - name: No Cloudflare token
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set — showcase built but not deployed"
