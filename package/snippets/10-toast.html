<!-- @snippet title="Уведомление" about="toast + alert. Уведомление называет результат: «Сохранено», а не «Успешно». В проекте уберите static — toast прикреплён к углу экрана." -->
<div class="p-6 bg-base-100 text-base-content min-h-40">
  <div class="toast toast-end toast-bottom static">
    <div role="status" class="alert shadow-lg border border-line bg-base-200"><span class="status status-success"></span><span>Сохранено</span></div>
    <div role="alert" class="alert shadow-lg border border-line bg-base-200"><span class="status status-error"></span><span>Не получилось собрать .docx: нет связи.</span><button class="btn btn-ghost btn-xs">Повторить</button></div>
  </div>
</div>
