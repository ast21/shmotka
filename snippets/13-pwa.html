<!-- @snippet title="PWA: версия и обновление" about="Для сайтов, которые ставятся на телефон. Логотип PWA рядом с версией (P и A — цвет текста, W — акцент проекта), нажатие на неё проверяет обновления; новая версия показывает плашку с кнопкой «Обновить». Оживляет shmotka/pwa (README → PWA). В проекте добавьте hidden плашке и подписи data-shm-pwa-status — их показывает скрипт." mobile="true" -->
<div class="bg-base-100 text-base-content p-4 flex flex-col gap-4">

    <h1 class="font-display text-2xl font-bold">Финансы</h1>
    <button type="button" data-shm-pwa-check title="Проверить обновления" aria-label="Версия 1.2.0, приложение PWA. Проверить обновления"
